<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kathero - Official</title>
<link rel="icon" type="image/svg+xml" href="svg/logo.svg">
<style>
  html, body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Verdana;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 0;
    box-sizing: border-box;
  }
  h1 {
    margin: 0 0 0px;
    font-size: 12px;
    font-weight: 100;
    letter-spacing: 6px;
    color: #f0f0f0;
    z-index: 5;
  }
  nav {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    z-index: 5;
  }
  a {
    color: #f0f0f0;
    font-size:11px;
    text-decoration: none;
    font-weight: 100;
    z-index: 5;
  }
  a:hover {
    text-decoration: underline;
  }
  .hero {
    height: 50vh;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    z-index: 5;
    transition: filter 0.1s ease-in-out; 
  }
  .hero:hover {
    filter: brightness(110%);
  }
  .svg {
  fill: #f0f0f0;
  margin-bottom:7px;
  z-index: 5;
  }
  .row {
    width: 80%;
    display: grid;
    grid-template-columns: auto ;
    align-items: center;
    justify-content: center;
    z-index: 5;
    gap: 10px;
  }
  .side {
    text-align: center;
    padding: 0px 0px;
    z-index: 5;
  }
  .back {
    position:fixed;
    display:grid;
    object-fit:cover;
    grid-template-columns: auto auto;
    justify-content: center;
    align-items: center;
    z-index: 1;
    filter: saturate(0%) contrast(100%) brightness(15%);
  }
  @media(max-width:900px){
  .row {
    grid-template-columns: auto;
    }
  h1 {
    font-size:15px;
    }
  a {
    font-size:15px;
    }
  }

</style>
</head>
<body>

<section class="back">

    <video src="videos/canvas.mov" autoplay muted loop playsinline></video>

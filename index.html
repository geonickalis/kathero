<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kathero - Official</title>
<link rel="icon" type="image/svg+xml" href="svg/logo.svg">
<style>
  html, body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Verdana;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 0;
    box-sizing: border-box;
  }
  h1 {
    margin: 0 0 0px;
    font-size: 14px;
    font-weight: 100;
    letter-spacing: 6px;
    color: #f0f0f0;
    z-index: 5;
  }
  nav {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    z-index: 5;
  }
  a {
    color: #f0f0f0;
    font-size:12px;
    text-decoration: none;
    font-weight: 100;
    z-index: 5;
  }
  a:hover {
    text-decoration: underline;
  }
  .hero {
    height: 40vh;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    z-index: 5;
    transition: filter 0.1s ease-in-out; 
  }
  .hero:hover {
    filter: brightness(110%);
  }
  .svg {
  fill: #f0f0f0;
  margin-bottom:7px;
  z-index: 5;
  }
  .row {
    width: 80%;
    display: grid;
    grid-template-columns: auto;
    align-items: center;
    justify-content: center;
    z-index: 5;
    gap: 10px;
  }
  .side {
    text-align: center;
    padding: 0px 0px;
    z-index: 5;
  }
  #grid {
    position: fixed;
    z-index: 1;
    filter: saturate(0%) contrast(120%) brightness(20%);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
  }
  canvas { width: auto; height: auto; display: block; }
  canvas.flip { transform: scaleX(-1); }

  @media(max-width:900px){
  .row {
    grid-template-columns: auto;
    }
  h1 {
    font-size:15px;
    }
  a {
    font-size:15px;
    }
  }
</style>
</head>
<body>

<video id="src" src="videos/canvas.mov" autoplay muted loop playsinline style="position:fixed; opacity:0;"></video>
<div id="grid"></div>

<img class="svg" src="svg/logo.svg" width="32" height="32" ></img>

<div class="row">
  <h1 class="side">KATHERO</h1>
  <a href="#">
   <!-- <video class="hero" src="videos/fightcanvas.mov" autoplay muted loop playsinline></video> -->
   <img class="hero" src="images/hero.jpg"></img>
  </a>
  <h1 class="side">10.16.2026</h1>
</div>

<nav>
  <a href="https://open.spotify.com/artist/3m5HTbYnpREIh9kdEcHlPf?si=u8VZgjKIQYGj9LJ4uxPHhw">SPOTIFY</a>
  <a href="https://music.apple.com/us/artist/kathero/1523082821">APPLE MUSIC</a>
  <a href="https://www.instagram.com/kathero_music/">INSTAGRAM</a>
  <a href="https://www.tiktok.com/@kathero_music">TIKTOK</a>
  <a href="https://www.youtube.com/@kathero8444">YOUTUBE</a>
  <a href="https://soundcloud.com/user-587381472">SOUNDCLOUD</a>
  <a style="color:#909090; font-size: 9px; margin-top: 40px;" href="mailto:katheromusic@gmail.com"> &copy;2026 KATHERO</a>
</nav>

<script>
const video = document.getElementById('src');
const grid = document.getElementById('grid');
const COLS = 1, ROWS = 2;
const ctxs = [];

function setup() {
  const w = video.videoWidth, h = video.videoHeight;
  for (let i = 0; i < COLS * ROWS; i++) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    if (i % 2 === 1) c.classList.add('flip');
    grid.appendChild(c);
    ctxs.push(c.getContext('2d'));
  }
}

function draw() {
  for (const ctx of ctxs) ctx.drawImage(video, 0, 0);
  if ('requestVideoFrameCallback' in video) {
    video.requestVideoFrameCallback(draw);
  } else {
    requestAnimationFrame(draw);
  }
}

video.addEventListener('loadedmetadata', setup);
video.addEventListener('play', draw, { once: true });
</script>
</body>
</html>
